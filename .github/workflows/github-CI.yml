name: 🚗 CI EcoVoit

on:
  push: # Lors du push sur toutes les branches
    branches:
      - "*"
  pull_request: # Lors d'une PR merge
    branches:
      - "PREPROD"
    types:
      - closed
      - opened

jobs:
  run-linters:
    name: 🧼 Run linters
    runs-on: ubuntu-latest

    steps:
      - name: 📌 Check out Git repository
        uses: actions/checkout@v3

      - name: 🛠️ Set up Node.js
        uses: actions/setup-node@v1
        with:
          node-version: 18

      - name: 🎯 Install Node.js dependencies
        run: |
          cd back
          npm i
          npm run lint
          cd ../front
          npm i
          npm run lint

      - name: 🏃🏽 Run linters back
        uses: wearerequired/lint-action@v2
        with:
          eslint_dir: ./back
          eslint: true
        if: startsWith(github.ref, 'refs/heads/back')

      - name: 🏃🏽 Run linters front
        uses: wearerequired/lint-action@v2
        with:
          eslint_dir: ./front
          eslint: true
        if: startsWith(github.ref, 'refs/heads/front')

      - name: 🤗 Hello CI
        run: echo "This job's status is ${{ job.status }}."

  Test:
    needs: run-linters
    name: 👤 Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5435:5432
    steps:
      - name: 🗂️ Check out code
        uses: actions/checkout@v2
      - name: 🧐 Go to tests and run test
        run: |
          if [[ "startsWith(github.ref, 'refs/heads/back')" ]]; then
            cd ./back && npm i && npm run test-ci
          elif [[ "startsWith(github.ref, 'refs/heads/front')" ]]; then
            cd ./front && npm i && npm run test-ci
          fi

  # passe pas
  builds:
    needs: Test
    name: Build back & front
    runs-on: ubuntu-latest
    steps:
      - name: Build back
        working-directory: back
        run: |
          npm i 
          npm run build
      - name: Build front
        working-directory: front
        run: |
          npm i
          npm run build

  docker:
    needs:
      - Test
    name: 🐳 Push on Docker
    runs-on: ubuntu-latest
    steps:
      - name: 🦅 Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🔨 Build and push back
        uses: docker/build-push-action@v4
        with:
          push: true
          context: "{{defaultContext}}:back"
          tags: "${{ secrets.DOCKERHUB_USERNAME }}/back-ecovoit:latest"

      - name: 🔨 Build and push front
        uses: docker/build-push-action@v4
        with:
          push: true
          context: "{{defaultContext}}:front"
          tags: "${{ secrets.DOCKERHUB_USERNAME }}/front-ecovoit:latest"
